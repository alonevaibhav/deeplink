        // Restaurant names mapping
        const RESTAURANT_NAMES = {
            '167': 'Goldfarms',
            '184': 'FATOUSH',
            '476': 'Sarovarr Multicuisine Restaurant'
        };

        // Extract business ID from URL
        function extractBusinessId() {
            const url = window.location.href;
            const pathname = window.location.pathname;
            const search = window.location.search;
            const hash = window.location.hash;

            console.log('🔍 Extracting business ID from:', {
                url,
                pathname,
                search,
                hash
            });

            let businessId = null;

            // Format 1: /restaurant/167 or /restaurant/167/
            const restaurantMatch = pathname.match(/\/restaurant\/(\d+)/);
            if (restaurantMatch && restaurantMatch[1]) {
                businessId = restaurantMatch[1];
                console.log('✅ Found in /restaurant/ path:', businessId);
                return businessId;
            }

            // Format 2: /r/167 or /r/167/
            const shortMatch = pathname.match(/\/r\/(\d+)/);
            if (shortMatch && shortMatch[1]) {
                businessId = shortMatch[1];
                console.log('✅ Found in /r/ path:', businessId);
                return businessId;

            // Format 3: ?business_id=167 or ?id=167
            const params = new URLSearchParams(search);
            if (params.has('business_id')) {
                businessId = params.get('business_id');
                console.log('✅ Found in query param business_id:', businessId);
                return businessId;
            }
            if (params.has('id')) {
                businessId = params.get('id');
                console.log('✅ Found in query param id:', businessId);
                return businessId;

            // Format 4: #167
            if (hash && hash.length > 1) {
                const hashValue = hash.substring(1);
                if (/^\d+$/.test(hashValue)) {
                    businessId = hashValue;
                    console.log('✅ Found in hash:', hashValue);
                    return hashValue;
                }
            }

            // Format 5: Look for any number in path segments
            const pathSegments = pathname.split('/').filter(s => s.length > 0);
            for (const segment of pathSegments) {
                if (/^\d+$/.test(segment)) {
                    businessId = segment;
                    console.log('✅ Found numeric segment in path:', businessId);
                    return businessId;
                }
            }

            // TESTING: Hardcode 167 as fallback for testing
            console.log('⚠️ No business ID found - using TEST ID: 167');
            return '167';

            if (!id) return false;
            const numId = parseInt(id, 10);
            return !isNaN(numId) && numId > 0;

            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return 'android';
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
            return 'desktop';

                statusEl.textContent = '✨ Opening restaurant...';

            console.log('📱 Attempting to open app...');

                // Android Intent URI format - most reliable for Android
                const intentUri = `intent://restaurant/${businessId}/payment#Intent;` +
                                  `scheme=creatoo;` +
                                  `package=${PACKAGE_NAME};` +
                                  `S.browser_fallback_url=${encodeURIComponent(PLAY_STORE_URL)};` +
                                  `end;`;
                
                console.log('🤖 Using Android Intent URI:', intentUri);
                
                // Try Intent URI first (this is the most reliable)

                // Backup: Also try standard deep link after a delay

                    console.log('🔄 Backup: Trying standard deep link');

            } else if (platform === 'ios') {
                // iOS: Use standard deep link with iframe trick
                console.log('🍎 Using iOS deep link');
                
                // Create invisible iframe
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = standardDeepLink;
                document.body.appendChild(iframe);
                
                // Also try direct navigation
                setTimeout(() => {
                    window.location.href = standardDeepLink;
                }, 100);

            } else {
                // Desktop fallback
                console.log('💻 Desktop detected - showing Play Store link');
                showPlayStoreFallback();
                return;
            }

            // Set timeout for Play Store fallback
            setTimeout(() => {
                showPlayStoreFallback();

        // Show Play Store fallback

            fallbackBtn.onclick = () => {

            // Auto redirect for mobile only
            if (platform !== 'desktop') {
                setTimeout(() => {
                    console.log('🏪 Auto-redirecting to Play Store');
                    window.location.href = PLAY_STORE_URL;
                }, 1500);
            }
        }

        // Debug info
        debugEl.innerHTML = `
            <strong>🔍 Debug Info:</strong><br>
            Full URL: ${window.location.href}<br>
            Pathname: ${window.location.pathname}<br>
            Search: ${window.location.search}<br>

            Valid: ${isValid ? '✅' : '❌'}<br>
            Platform: ${platform}<br>

<body>
    <div class="container">
        <div class="logo">🍽️</div>
        <h1>The Waiter</h1>
        <p class="subtitle">Restaurant Management System</p>
        <p id="message">Connecting to your table...</p>
        
        <div id="table-info" style="display: none;">
            <div class="table-badge">
                🪑 Table <span id="table-number"></span>
            </div>
        </div>
        
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
        
        <p id="status"></p>
        <div id="error" class="error" style="display: none;"></div>
        <div id="success" class="success" style="display: none;"></div>

        <button id="fallbackBtn" class="fallback-btn" style="display: none;">
            📲 Download The Waiter App
        </button>
        
        <div class="debug" id="debug"></div>
    </div>

    <script>
        // ============================================
        // THE WAITER APP CONFIGURATION
        // ============================================
        const PACKAGE_NAME = 'com.example.thewaiter';
        const APP_SCHEME = 'thewaiter';
        const PLAY_STORE_URL = `https://play.google.com/store/apps/details?id=${PACKAGE_NAME}`;
        
        // ============================================
        // EXTRACT TABLE ID FROM URL
        // ============================================
        function extractTableId() {
            const url = window.location.href;
            const pathname = window.location.pathname;
            const search = window.location.search;
            const hash = window.location.hash;

            console.log('🔍 Extracting table ID from:', {
                url,
                pathname,
                search,
                hash
            });

            let tableId = null;

            // Format 1: /table/123 or /table/123/
            const tableMatch = pathname.match(/\/table\/(\w+)/);
            if (tableMatch && tableMatch[1]) {
                tableId = tableMatch[1];
                console.log('✅ Found in /table/ path:', tableId);
                return tableId;
            }

            // Format 2: /t/123 (short URL)
            const shortMatch = pathname.match(/\/t\/(\w+)/);
            if (shortMatch && shortMatch[1]) {
                tableId = shortMatch[1];
                console.log('✅ Found in /t/ path:', tableId);
                return tableId;
            }

            // Format 3: ?table_id=123 or ?table=123
            const params = new URLSearchParams(search);
            if (params.has('table_id')) {
                tableId = params.get('table_id');
                console.log('✅ Found in query param table_id:', tableId);
                return tableId;
            }
            if (params.has('table')) {
                tableId = params.get('table');
                console.log('✅ Found in query param table:', tableId);
                return tableId;
            }
            if (params.has('id')) {
                tableId = params.get('id');
                console.log('✅ Found in query param id:', tableId);
                return tableId;
            }

            // Format 4: #123 (hash fragment)
            if (hash && hash.length > 1) {
                const hashValue = hash.substring(1);
                if (/^[\w-]+$/.test(hashValue)) {
                    tableId = hashValue;
                    console.log('✅ Found in hash:', hashValue);
                    return hashValue;
                }
            }

            // Format 5: Look for any alphanumeric segment in path
            const pathSegments = pathname.split('/').filter(s => s.length > 0);
            for (const segment of pathSegments) {
                if (/^[\w-]+$/.test(segment) && segment !== 'table' && segment !== 't') {
                    tableId = segment;
                    console.log('✅ Found segment in path:', tableId);
                    return tableId;
                }
            }

            console.log('⚠️ No table ID found in URL');
            return null;
        }

        // ============================================
        // VALIDATE TABLE ID
        // ============================================
        function validateTableId(id) {
            if (!id) return false;
            // Accept alphanumeric table IDs (e.g., "123", "A5", "T-10")
            return /^[\w-]+$/.test(id) && id.length > 0;
        }

        // ============================================
        // DETECT PLATFORM
        // ============================================
        function getPlatform() {
            const ua = navigator.userAgent;
            if (/android/i.test(ua)) return 'android';
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
            return 'desktop';
        }

        // ============================================
        // GENERATE DEEP LINKS
        // ============================================
        function generateDeepLinks(tableId) {
            const links = {};

            if (tableId) {
                // Format 1: thewaiter://table/123
                links.format1 = `${APP_SCHEME}://table/${tableId}`;
                
                // Format 2: thewaiter://user?table_id=123
                links.format2 = `${APP_SCHEME}://user?table_id=${tableId}`;
                
                // Format 3: thewaiter://qr/table/123
                links.format3 = `${APP_SCHEME}://qr/table/${tableId}`;
                
                // Format 4: thewaiter://open?table_id=123
                links.format4 = `${APP_SCHEME}://open?table_id=${tableId}`;
                
                // Primary link (use format 1 as default)
                links.primary = links.format1;
            } else {
                // Generic app open link
                links.primary = `${APP_SCHEME}://open`;
            }

            return links;
        }

        // ============================================
        // MAIN EXECUTION
        // ============================================
        const tableId = extractTableId();
        const isValid = validateTableId(tableId);
        const platform = getPlatform();
        const deepLinks = generateDeepLinks(tableId);

        console.log('📊 Deep Link Info:', {
            tableId,
            isValid,
            platform,
            deepLinks
        });

        // ============================================
        // UI ELEMENTS
        // ============================================
        const statusEl = document.getElementById('status');
        const messageEl = document.getElementById('message');
        const tableInfoEl = document.getElementById('table-info');
        const tableNumberEl = document.getElementById('table-number');
        const fallbackBtn = document.getElementById('fallbackBtn');
        const debugEl = document.getElementById('debug');
        const errorEl = document.getElementById('error');
        const successEl = document.getElementById('success');

        // ============================================
        // UPDATE UI WITH TABLE INFO
        // ============================================
        if (isValid && tableId) {
            tableInfoEl.style.display = 'block';
            tableNumberEl.textContent = tableId;
            successEl.textContent = `✅ Table ${tableId} detected! Opening app...`;
            successEl.style.display = 'block';
            messageEl.textContent = 'Preparing your table experience';
        } else {
            messageEl.textContent = 'Opening The Waiter app...';
            errorEl.textContent = '⚠️ No table ID found. Opening app without table context.';
            errorEl.style.display = 'block';
        }

        // ============================================
        // ATTEMPT TO OPEN APP
        // ============================================
        function attemptAppOpen() {
            const primaryLink = deepLinks.primary;
            
            console.log('📱 Attempting to open app with:', primaryLink);
            statusEl.textContent = isValid ? '✨ Opening your table...' : '📱 Opening app...';

            if (platform === 'android') {
                // Android Intent URI - Most reliable for Android
                const intentUri = isValid 
                    ? `intent://table/${tableId}#Intent;scheme=${APP_SCHEME};package=${PACKAGE_NAME};S.browser_fallback_url=${encodeURIComponent(PLAY_STORE_URL)};end;`
                    : `intent://open#Intent;scheme=${APP_SCHEME};package=${PACKAGE_NAME};S.browser_fallback_url=${encodeURIComponent(PLAY_STORE_URL)};end;`;
                
                console.log('🤖 Android Intent URI:', intentUri);
                
                // Try Intent URI (most reliable)
                window.location.href = intentUri;
                
                // Backup: Try standard deep link
                setTimeout(() => {
                    console.log('🔄 Backup: Trying standard deep link');
                    window.location.href = primaryLink;
                }, 500);

                // Try all formats as fallbacks
                if (isValid) {
                    setTimeout(() => {
                        console.log('🔄 Trying format 2');
                        window.location.href = deepLinks.format2;
                    }, 1000);
                    
                    setTimeout(() => {
                        console.log('🔄 Trying format 4');
                        window.location.href = deepLinks.format4;
                    }, 1500);
                }

            } else if (platform === 'ios') {
                // iOS: Use iframe trick + direct navigation
                console.log('🍎 iOS deep link strategy');
                
                // Create invisible iframe
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = primaryLink;
                document.body.appendChild(iframe);
                
                // Direct navigation after short delay
                setTimeout(() => {
                    window.location.href = primaryLink;
                }, 100);

            } else {
                // Desktop
                console.log('💻 Desktop detected - showing download link');
                showPlayStoreFallback();
                return;
            }

            // Show fallback after timeout
            setTimeout(() => {
                showPlayStoreFallback();
            }, 2500);
        }

        // ============================================
        // SHOW PLAY STORE FALLBACK
        // ============================================
        function showPlayStoreFallback() {
            statusEl.textContent = '📲 App not installed?';
            messageEl.textContent = 'Get The Waiter app to continue';
            
            fallbackBtn.style.display = 'inline-block';
            fallbackBtn.onclick = () => {
                window.location.href = PLAY_STORE_URL;
            };

            // Auto-redirect on mobile
            if (platform !== 'desktop') {
                setTimeout(() => {
                    console.log('🏪 Redirecting to Play Store');
                    window.location.href = PLAY_STORE_URL;
                }, 2000);
            }
        }

        // ============================================
        // DEBUG INFO
        // ============================================
        debugEl.innerHTML = `
            <strong>🔍 Debug Information</strong><br><br>
            <strong>URL Details:</strong><br>
            Full URL: ${window.location.href}<br>
            Pathname: ${window.location.pathname}<br>
            Search: ${window.location.search || '(none)'}<br>
            Hash: ${window.location.hash || '(none)'}<br><br>
            <strong>Extracted Info:</strong><br>
            Table ID: <strong>${tableId || 'NOT FOUND'}</strong><br>
            Valid: ${isValid ? '✅ Yes' : '❌ No'}<br>
            Platform: <strong>${platform}</strong><br><br>
            <strong>Deep Links:</strong><br>
            Primary: ${deepLinks.primary}<br>
            ${isValid ? `Format 2: ${deepLinks.format2}<br>Format 4: ${deepLinks.format4}<br>` : ''}
            <br><strong>Package:</strong> ${PACKAGE_NAME}<br>
            User Agent: ${navigator.userAgent.substring(0, 80)}...
        `;

        // ============================================
        // EXECUTE BASED ON PLATFORM
        // ============================================
        if (platform === 'desktop') {
            messageEl.textContent = 'Scan this QR code on your mobile device';
            statusEl.textContent = '📱 This link works on phones';
            document.querySelector('.dots').style.display = 'none';
            showPlayStoreFallback();
        } else {
            // Mobile: Attempt app open after delay
            setTimeout(attemptAppOpen, 400);
        }

        // ============================================
        // DETECT IF APP OPENED SUCCESSFULLY
        // ============================================
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('✅ App opened successfully!');
                statusEl.textContent = '✅ Redirecting to app...';
                successEl.textContent = '✅ App opened successfully!';
                successEl.style.display = 'block';
            }
        });

        window.addEventListener('blur', () => {
            console.log('✅ Page lost focus - app likely opened');
        });
    </script>
</body>
</html>
